<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="picks.data.js"></script>
    <script src="assets/picks.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFFFFF; }
      #root { width: 100%; height: 100%; position: relative; font-family: "Outfit", "Meera Inimai", sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="2.6" data-duration="3.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="bgm" class="clip" src="assets/music/bed-a.mp3" data-start="0" data-duration="6.5" data-volume="0.16" data-fade-in="0.3" data-fade-out="1.2" data-track-index="3"></audio>
      <audio id="sfx-whoosh" class="clip" src="assets/sfx/whoosh-a.mp3" data-start="2.45" data-duration="0.69" data-volume="0.4" data-track-index="5"></audio>
      <audio id="sfx-brand" class="clip" src="assets/sfx/brand.mp3" data-start="3.05" data-duration="0.78" data-volume="0.8" data-track-index="6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
