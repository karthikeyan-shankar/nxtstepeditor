    const vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};

    if (!deadline) {
      // Without the deadline row the block re-centres in the readable band (168-1330 px).

      document.getElementById("endcard-close").style.display = "none";

    // the mark is carried in on the white the tap opened
    tl.fromTo("#endcard-logo", { scale: 0.55, y: 140, opacity: 0, filter: "blur(10px)" },

      tl.set("#endcard-hand", { rotation: 0, svgOrigin: "42 47" }, 0);

        tl.to("#endcard-hand", { rotation: (k + 1) * 30, duration: 0.12, ease: "back.out(2.2)" }, 2.2 + k * 0.5333);
