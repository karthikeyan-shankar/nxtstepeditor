<template>

  <script>
    const tl = gsap.timeline({ paused: true });
    // colour flood: the dark ground becomes the buying card's blue
    tl.fromTo("#offer-blue", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0);
    // the normal price first, then the red line through it
    tl.fromTo("#offer-was", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.12);
    tl.fromTo("#offer-strike", { scaleX: 0, rotation: -8 }, { scaleX: 1, rotation: -8, duration: 0.18, ease: "power2.out" }, 0.32);
    // the price appears small, already selected
    tl.fromTo("#offer-price", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 0.5, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.3);
    tl.fromTo("#offer-box", { scale: 0.5, opacity: 0 }, { scale: 0.5, opacity: 1, duration: 0.1, ease: "none" }, 0.5);
    const hs = [["#offer-h1", 145, 105], ["#offer-h2", -145, 105], ["#offer-h3", 145, -105], ["#offer-h4", -145, -105]];
    hs.forEach(([id, x, y]) => tl.fromTo(id, { x, y, opacity: 0 }, { x, y, opacity: 1, duration: 0.1, ease: "none" }, 0.5));
    // the cursor arrives at the bottom-right handle, grabs it and drags: the price grows to full size
    tl.fromTo("#offer-cursor", { x: 1150, y: 1500, scale: 1 }, { x: 676, y: 742, duration: 0.4, ease: "power3.out" }, 0.38);
    tl.to("#offer-cursor", { scale: 0.88, duration: 0.06, ease: "power2.in", transformOrigin: "15% 10%" }, 0.78);
    tl.to("#offer-price", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 0.85);
    tl.to("#offer-box", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 0.85);
    hs.forEach(([id]) => tl.to(id, { x: 0, y: 0, duration: 0.6, ease: "power2.inOut" }, 0.85));
    tl.to("#offer-cursor", { x: 821, y: 847, duration: 0.6, ease: "power2.inOut" }, 0.85);
    tl.to("#offer-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, 1.45);
    // let go: the selection clears
    tl.to(["#offer-box", "#offer-h1", "#offer-h2", "#offer-h3", "#offer-h4"], { opacity: 0, duration: 0.25, ease: "power2.out" }, 1.75);
    tl.to("#offer-cursor", { x: 1150, y: 1700, duration: 0.4, ease: "power3.in" }, 1.8);
    // what ₹9 buys, then the tape slaps over it
    tl.fromTo("#offer-a", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 2.05);
    tl.to("#offer-a", { opacity: 0, filter: "blur(10px)", duration: 0.15, ease: "power3.in" }, 4.15);
    tl.fromTo("#offer-tape", { scale: 1.3, rotation: -7, opacity: 0 }, { scale: 1, rotation: -3, opacity: 1, duration: 0.22, ease: "back.out(1.7)" }, 4.3);
    // the button, then the tap, then an iris of white from the tap
    tl.fromTo("#offer-pay", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 5.4);
    tl.to("#offer-cursor", { x: 600, y: 1230, scale: 1, duration: 0.65, ease: "power3.out" }, 6.35);
    tl.to("#offer-cursor", { scale: 0.86, duration: 0.07, ease: "power2.in" }, 7.05);
    tl.to("#offer-pay", { scale: 0.95, duration: 0.07, ease: "power2.in" }, 7.05);
    // it starts wider than the button (182 px > 150 px), so from its first frame it reads as a circle, not as missing text
    tl.set("#offer-iris", { scale: 0 }, 0);
    tl.set("#offer-iris", { scale: 1.3 }, 7.12);
    tl.to("#offer-iris", { scale: 30, duration: 0.6, ease: "power3.in" }, 7.12);
    window.__timelines["offer"] = tl;
  </script>
