    const q = NS.prep(document.getElementById("endcard-q"), 0);

    // Timed to voice line 5 (Thambi, from 0.3 s here): வீக்னெஸ் 1.31 · அப்போ 3.97 · நெக்ஸ்ட்ஸ்டெப் 4.37 · பாருங்க 6.2

    tl.set(q.caret, { opacity: 0 }, 3.9);
    // "அப்போ நெக்ஸ்ட்ஸ்டெப் ஃபோர் யூவை…": the bar arrives and the address types itself

    NS.typeIn(tl, url, 4.37, 0.83);
    NS.blink(tl, url, 5.2, 6.3);

    tl.to("#endcard-go", { scale: 1, duration: 0.15, ease: "power2.out" }, 6.27);

    // ---- the app opens: its launch reveal, timed from T (= the app's 0 s) ----

    tl.to("#endcard-iris", { opacity: 1, duration: 0.2, ease: "power2.in" }, 6.35);        // the app's dark launch screen
    tl.set("#endcard-white", { opacity: 1 }, T);
    tl.set(["#endcard-q", "#endcard-bar", "#endcard-cursor"], { opacity: 0 }, T);
    tl.fromTo("#endcard-hole", { scale: 0 }, { scale: 60, duration: 0.52, ease: "power2.inOut" }, T + 0.15);   // iris
    tl.set("#endcard-iris", { opacity: 0 }, T + 0.7);
    // seed: 0% hidden at .4, 30% shown at 1, 100% gone at .6

    tl.to("#endcard-seed", { opacity: 0, scale: 0.6, duration: 0.434, ease: "sine.in" }, T + 0.566);
    // three ripple rings
    [["#endcard-r1", 0.48], ["#endcard-r2", 0.78], ["#endcard-r3", 1.12]].forEach(([id, d]) => {
      tl.fromTo(id, { scale: 0.12 }, { scale: 2.6, duration: 1.9, ease: "power3.out" }, T + d);
      tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.285, ease: "none" }, T + d);
      tl.to(id, { opacity: 0, duration: 1.615, ease: "power1.out" }, T + d + 0.285);
    });
    // the wordmark grows (0.72 -> 1 with a slight overshoot, blur clears by 60%)
    tl.fromTo("#endcard-base", { scale: 0.72 }, { scale: 1, duration: 0.7, ease: "back.out(1.25)" }, T + 0.38);
    tl.fromTo("#endcard-base", { opacity: 0, filter: "blur(5px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power2.out" }, T + 0.38);
    // the cap drops in from the top right, swings and settles (pivot 86% 22%)
    tl.set("#endcard-cap", { transformOrigin: "86% 22%", xPercent: 46, yPercent: -95, rotation: 28, scale: 0.9, opacity: 0 }, 0);
    tl.to("#endcard-cap", { opacity: 1, duration: 0.27, ease: "none" }, T + 0.85);
    tl.to("#endcard-cap", { xPercent: -2, yPercent: 4, rotation: -9, scale: 1, duration: 0.546, ease: "power3.out" }, T + 0.85);
    tl.to("#endcard-cap", { xPercent: 0, yPercent: -1, rotation: 4, duration: 0.117, ease: "sine.inOut" }, T + 1.396);
    tl.to("#endcard-cap", { xPercent: 0, yPercent: 0, rotation: 0, duration: 0.117, ease: "sine.out" }, T + 1.513);
